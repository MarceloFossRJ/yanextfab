services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yanextfab
      POSTGRES_PASSWORD: yanextfab
      POSTGRES_DB: yanextfab
    ports:
      - "5433:5432" # host 5433 to avoid clashing with any local Postgres on the default 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanextfab"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://yanextfab:yanextfab@postgres:5432/yanextfab
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-deploying-anywhere-real}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@yanextfab.dev
      SMTP_TLS: "false"
      SMTP_SSL: "false"
      FRONTEND_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAPI_EXPORT_PATH: /shared/openapi.json
    volumes:
      - ./backend:/app
      - openapi_schema:/shared
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      OPENAPI_SCHEMA_PATH: /shared/openapi.json
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - openapi_schema:/shared
    depends_on:
      - backend

volumes:
  postgres_data:
  openapi_schema:
